[project]
name = "scout-api"
version = "0.1.0"
description = "Scout — AI-native B2B lead intelligence API and workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.3",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "google-genai==2.28.0",
  "httpx==0.28.1",
  "selectolax==1.0.0",
  "lxml==6.1.3",
  "dnspython==2.8.0",
  "tldextract==5.4.0",
  "rapidfuzz==3.14.6",
  "pyjwt==2.15.1",
  "orjson==3.12.0",
  "structlog==26.1.0",
  "sse-starlette==3.5.0",
  "python-multipart==0.0.32",
  "idna==3.20",
  "email-validator==2.3.0",
  "aiosmtplib==5.1.3",
  "unidecode>=1.4.0",
]

[project.optional-dependencies]
browser = [
  "crawl4ai==0.9.4",
  "playwright==1.63.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S311", "B008", "RUF012", "S608", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires a Postgres database (TEST_DATABASE_URL)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
